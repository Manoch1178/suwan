<!DOCTYPE html>
<html lang="th">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>บันทึกออร์เดอร์</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Sarabun:wght@300;400;500;600;700&family=Noto+Serif+Thai:wght@600;700&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet">
<style>
:root{
  --paper:#fdfcf7;
  --paper2:#f7f4ec;
  --paper3:#eeead9;
  --ink:#19160e;
  --ink2:#3c3822;
  --ink3:#7a7356;
  --ink4:#b0a984;
  --ink5:#d8d2be;
  --rule:#e2dcc8;
  --rule2:#edeadb;
  --accent:#b84a22;
  --accent-lt:#fdf0eb;
  --green:#2a7846;
  --blue:#2a52a8;
  --mono:'JetBrains Mono',monospace;
  --serif:'Noto Serif Thai',serif;
  --sans:'Sarabun',sans-serif;
}
*{box-sizing:border-box;margin:0;padding:0}
html{font-size:14px}
body{
  font-family:var(--sans);background:var(--paper2);
  color:var(--ink);min-height:100vh;padding:28px 20px 70px;
}
body::before{
  content:'';position:fixed;inset:0;pointer-events:none;z-index:0;
  background-image:repeating-linear-gradient(
    0deg,transparent,transparent 31px,
    rgba(180,168,130,.11) 31px,rgba(180,168,130,.11) 32px
  );
}
.wrap{max-width:680px;margin:0 auto;position:relative;z-index:1}

/* HEADER */
.doc-hdr{
  display:flex;align-items:flex-end;justify-content:space-between;
  border-bottom:2px solid var(--ink2);padding-bottom:12px;margin-bottom:18px;
}
.doc-hdr-l .kicker{
  font-family:var(--mono);font-size:9px;letter-spacing:3px;
  text-transform:uppercase;color:var(--ink4);margin-bottom:4px;
}
.doc-hdr-l h1{
  font-family:var(--serif);font-size:22px;font-weight:700;
  color:var(--ink);line-height:1;
}
.doc-num{
  font-family:var(--mono);font-size:10.5px;
  color:var(--paper);background:var(--ink2);
  padding:3px 10px;border-radius:3px;letter-spacing:.5px;
}

/* BILL HEAD */
.bill-head{
  background:var(--paper);border:1px solid var(--rule);border-radius:9px;
  padding:12px 16px;margin-bottom:14px;
  display:grid;grid-template-columns:1fr auto;gap:10px 18px;align-items:end;
  box-shadow:0 1px 3px rgba(0,0,0,.04);
}
.fl{display:flex;flex-direction:column;gap:4px}
.fl-lbl{
  font-family:var(--mono);font-size:8.5px;font-weight:500;
  letter-spacing:2px;text-transform:uppercase;color:var(--ink4);
}

/* Customer field */
.cust-wrap{position:relative}
.cust-inp{
  width:100%;padding:7px 10px;
  background:var(--paper2);border:1px solid var(--rule);border-radius:6px;
  font-family:var(--sans);font-size:14.5px;font-weight:500;color:var(--ink);
  outline:none;transition:border-color .15s,background .15s;
}
.cust-inp:focus{border-color:var(--ink3);background:var(--paper)}
.cust-inp::placeholder{color:var(--ink5)}

/* Customer dropdown */
.cust-dd{
  position:absolute;top:calc(100% + 3px);left:0;right:0;z-index:600;
  background:var(--paper);border:1px solid var(--rule);
  border-top:2px solid var(--accent);border-radius:0 0 8px 8px;
  max-height:220px;overflow-y:auto;
  box-shadow:0 10px 28px rgba(0,0,0,.12);display:none;
  scrollbar-width:thin;scrollbar-color:var(--rule) transparent;
}
.cust-dd::-webkit-scrollbar{width:4px}
.cust-dd::-webkit-scrollbar-thumb{background:var(--rule);border-radius:2px}
.cust-item{
  padding:8px 12px;cursor:pointer;font-size:13.5px;color:var(--ink);
  border-bottom:.5px solid var(--rule2);transition:background .08s;
}
.cust-item:last-child{border-bottom:none}
.cust-item:hover,.cust-item.hi{background:var(--accent-lt)}
.cust-item mark{background:none;color:var(--accent);font-weight:600}
.cust-empty{padding:10px 12px;text-align:center;color:var(--ink4);font-size:12px}

/* Date */
.date-inp{
  padding:7px 10px;background:var(--paper2);border:1px solid var(--rule);border-radius:6px;
  font-family:var(--mono);font-size:12px;color:var(--ink);
  outline:none;min-width:140px;transition:border-color .15s;
}
.date-inp:focus{border-color:var(--ink3)}

/* TABLE */
.tcard{
  background:var(--paper);border:1px solid var(--rule);border-radius:9px;
  overflow:hidden;margin-bottom:14px;box-shadow:0 1px 3px rgba(0,0,0,.04);
}
table{width:100%;border-collapse:collapse}
thead tr{background:var(--paper3);border-bottom:1.5px solid var(--rule)}
th{
  padding:8px 10px;font-family:var(--mono);font-size:8.5px;font-weight:500;
  letter-spacing:1.5px;text-transform:uppercase;color:var(--ink3);text-align:left;
}
td{padding:0;border-bottom:.5px solid var(--rule2);vertical-align:middle}
tr.irow:last-child td{border-bottom:none}
tr.irow:hover td{background:rgba(184,74,34,.03)}

/* Row num */
.td-n{
  width:26px;text-align:center;padding:0 !important;
  font-family:var(--mono);font-size:9.5px;color:var(--ink5);
  background:var(--paper2);border-right:.5px solid var(--rule2);
}

/* Product */
.td-prod{position:relative}
.prod-inp{
  width:100%;padding:7px 10px;background:transparent;border:none;
  font-family:var(--sans);font-size:13px;font-weight:500;color:var(--ink);
  outline:none;line-height:1.3;
}
.prod-inp::placeholder{color:var(--ink5);font-weight:300}
.prod-inp:focus{background:rgba(184,74,34,.025)}

/* Product dropdown */
.pacd{
  position:absolute;top:100%;left:0;right:0;z-index:400;
  background:var(--paper);border:1px solid var(--rule);
  border-top:2px solid var(--accent);border-radius:0 0 8px 8px;
  max-height:230px;overflow-y:auto;
  box-shadow:0 10px 28px rgba(0,0,0,.12);display:none;
  scrollbar-width:thin;scrollbar-color:var(--rule) transparent;
}
.pacd::-webkit-scrollbar{width:4px}
.pacd::-webkit-scrollbar-thumb{background:var(--rule);border-radius:2px}
.paci{
  display:flex;align-items:center;justify-content:space-between;
  padding:7px 10px;cursor:pointer;border-bottom:.5px solid var(--rule2);
  gap:8px;transition:background .08s;
}
.paci:last-child{border-bottom:none}
.paci:hover,.paci.hi{background:var(--accent-lt)}
.paci-name{font-size:12.5px;color:var(--ink);flex:1;line-height:1.3}
.paci-name mark{background:none;color:var(--accent);font-weight:600}
.paci-unit{
  font-family:var(--mono);font-size:9.5px;color:var(--ink4);
  background:var(--paper3);border:1px solid var(--rule2);
  padding:2px 6px;border-radius:3px;flex-shrink:0;
}
.pacd-empty{padding:12px;text-align:center;color:var(--ink4);font-size:12px}

/* Qty */
.td-qty{width:68px;border-left:.5px solid var(--rule2)}
.qty-inp{
  width:100%;padding:7px 6px;background:transparent;border:none;
  font-family:var(--mono);font-size:13px;font-weight:500;
  color:var(--ink);text-align:center;outline:none;
}
.qty-inp:focus{background:rgba(184,74,34,.025)}

/* Unit — editable */
.td-unit{width:82px;border-left:.5px solid var(--rule2)}
.unit-inp{
  width:100%;padding:7px 8px;background:var(--paper2);border:none;
  font-family:var(--mono);font-size:11.5px;font-weight:500;
  color:var(--ink3);outline:none;transition:background .15s,color .15s;
}
.unit-inp:focus{background:var(--paper);color:var(--ink);box-shadow:inset 0 0 0 1.5px var(--blue)}
.unit-inp::placeholder{color:var(--ink5)}

/* Del */
.td-del{width:26px;border-left:.5px solid var(--rule2)}
.del-btn{
  width:100%;min-height:34px;background:none;border:none;cursor:pointer;
  color:var(--ink5);font-size:14px;
  display:flex;align-items:center;justify-content:center;transition:color .14s;
}
.del-btn:hover{color:var(--accent)}

/* ACTIONS */
.actions{display:flex;gap:8px}
.btn{
  padding:9px 16px;border-radius:7px;
  font-family:var(--sans);font-size:13.5px;font-weight:600;
  cursor:pointer;border:none;transition:all .14s;
}
.btn-ghost{background:var(--paper);color:var(--ink2);border:1px solid var(--rule)}
.btn-ghost:hover{background:var(--paper3);border-color:var(--ink4)}
.btn-danger{background:var(--paper);color:var(--accent);border:1px solid #f0c4b4}
.btn-danger:hover{background:var(--accent-lt)}
.btn-green{background:var(--green);color:#fff;font-weight:700}
.btn-green:hover{filter:brightness(1.1)}
.btn-save{background:var(--ink);color:var(--paper);flex:1;font-size:14px;padding:10px;font-weight:700}
.btn-save:hover{background:var(--ink2)}

/* PRINT */
@media print{
  body{background:#fff;color:#000;padding:10px}
  body::before{display:none}
  .no-print{display:none!important}
  .pacd,.cust-dd{display:none!important}
  .cust-inp,.date-inp,.prod-inp,.qty-inp,.unit-inp{
    background:transparent;border:none;color:#000;padding:4px 6px;
  }
  .bill-head,.tcard{background:#fff;border:1px solid #bbb;border-radius:4px;box-shadow:none}
  .doc-hdr{border-bottom:1.5px solid #000}
  thead tr{background:#eee}
  th{color:#444}
  td{border-bottom:.5px solid #ccc!important}
  .td-n{background:#f5f5f5;border-right:.5px solid #ccc}
  tr.irow:hover td{background:transparent}
  .td-del{display:none}
  .unit-inp:focus{box-shadow:none}
}
</style>
</head>
<body>
<div class="wrap">

  <div class="doc-hdr no-print">
    <div class="doc-hdr-l">
      <div class="kicker">Order Note</div>
      <h1>บันทึกออร์เดอร์</h1>
    </div>
    <div class="doc-num" id="docNum">ORD-0001</div>
  </div>

  <div class="bill-head">
    <div class="fl">
      <div class="fl-lbl">ชื่อลูกค้า</div>
      <div class="cust-wrap">
        <input class="cust-inp" id="custInp" type="text"
          placeholder="ค้นหาหรือพิมพ์ชื่อลูกค้า..."
          autocomplete="off" spellcheck="false"
          oninput="onCustInput(this)"
          onkeydown="onCustKey(event)"
          onblur="onCustBlur()">
        <div class="cust-dd" id="custDd"></div>
      </div>
    </div>
    <div class="fl">
      <div class="fl-lbl">วันที่</div>
      <input class="date-inp" id="orderDate" type="date">
    </div>
  </div>

  <div class="tcard">
    <table>
      <thead>
        <tr>
          <th style="width:26px;background:var(--paper3)"></th>
          <th>รายการสินค้า</th>
          <th style="width:68px;text-align:center">จำนวน</th>
          <th style="width:82px">หน่วย</th>
          <th class="no-print" style="width:26px"></th>
        </tr>
      </thead>
      <tbody id="tbody"></tbody>
    </table>
  </div>

  <div class="actions no-print">
    <button class="btn btn-danger" onclick="clearAll()">ล้าง</button>
    <button class="btn btn-ghost" onclick="window.print()">🖨 พิมพ์</button>
    <button class="btn btn-green" onclick="exportCSV()">📄 CSV</button>
    <button class="btn btn-save" onclick="saveOrder()">✓ บันทึก</button>
  </div>

</div>

  return(ccache[q]=C.filter(c=>c.toLowerCase().includes(ql)).slice(0,40));
}
function hl(text,q){
  if(!q)return esc(text);
  const i=text.toLowerCase().indexOf(q.toLowerCase());
  if(i<0)return esc(text);
  return esc(text.slice(0,i))+'<mark>'+esc(text.slice(i,i+q.length))+'</mark>'+esc(text.slice(i+q.length));
}
function showCustDd(res,q){
  const dd=document.getElementById('custDd');
  cHi=-1;cOpen=true;
  dd.innerHTML=res.length
    ?res.map((c,j)=>`<div class="cust-item" data-j="${j}"
        onmousedown="pickCust(event,${j},'${esc(c)}')"
        onmouseover="setCustHi(${j})">${hl(c,q)}</div>`).join('')
    :'<div class="cust-empty">ไม่พบชื่อลูกค้า</div>';
  dd.style.display='block';
}
function hideCustDd(){
  document.getElementById('custDd').style.display='none';
  cOpen=false;cHi=-1;
}
function setCustHi(j){
  cHi=j;
  document.querySelectorAll('.cust-item').forEach((el,k)=>el.classList.toggle('hi',k===j));
}
function onCustInput(inp){
  const q=inp.value.trim();
  if(!q){hideCustDd();return;}
  showCustDd(custSearch(q),q);
}
function onCustKey(e){
  const items=document.querySelectorAll('.cust-item');
  if(e.key==='ArrowDown'){
    e.preventDefault();cHi=Math.min(cHi+1,items.length-1);setCustHi(cHi);
    if(items[cHi])items[cHi].scrollIntoView({block:'nearest'});
  }else if(e.key==='ArrowUp'){
    e.preventDefault();cHi=Math.max(cHi-1,0);setCustHi(cHi);
    if(items[cHi])items[cHi].scrollIntoView({block:'nearest'});
  }else if(e.key==='Enter'||e.key==='Tab'){
    if(cOpen&&items.length){
      const t=cHi>=0?items[cHi]:items[0];
      if(t){e.preventDefault();t.dispatchEvent(new MouseEvent('mousedown',{bubbles:true}));return;}
    }
  }else if(e.key==='Escape')hideCustDd();
}
function onCustBlur(){setTimeout(hideCustDd,180)}
function pickCust(e,j,escaped){
  e.preventDefault();
  document.getElementById('custInp').value=unesc(escaped);
  hideCustDd();
  setTimeout(()=>document.getElementById('orderDate').focus(),0);
}

/* ── ROWS ── */
function initRows(){
  rows=Array.from({length:ROWS},()=>({name:'',unit:'',qty:''}));
  render();
}
function render(){
  document.getElementById('tbody').innerHTML=rows.map((r,i)=>`
    <tr class="irow">
      <td class="td-n">${i+1}</td>
      <td class="td-prod">
        <input class="prod-inp" type="text"
          value="${esc(r.name)}" autocomplete="off" spellcheck="false" data-i="${i}"
          oninput="onProdInput(this,${i})"
          onkeydown="onProdKey(event,${i})"
          onblur="onProdBlur(${i})">
        <div class="pacd" id="pacd${i}"></div>
      </td>
      <td class="td-qty">
        <input class="qty-inp" type="number" min="0.001" step="any"
          value="${esc(r.qty)}" data-i="${i}"
          onchange="rows[${i}].qty=this.value"
          oninput="rows[${i}].qty=this.value"
          onkeydown="onQtyKey(event,${i})">
      </td>
      <td class="td-unit">
        <input class="unit-inp" type="text"
          value="${esc(r.unit)}" data-i="${i}"
          onchange="rows[${i}].unit=this.value"
          oninput="rows[${i}].unit=this.value"
          onkeydown="onUnitKey(event,${i})">
      </td>
      <td class="td-del no-print">
        <button class="del-btn" onclick="clearRow(${i})">×</button>
      </td>
    </tr>`).join('');
}
function clearRow(i){
  rows[i]={name:'',unit:'',qty:''};render();
  setTimeout(()=>{const inp=document.querySelector(`.prod-inp[data-i="${i}"]`);if(inp)inp.focus();},0);
}

/* ── PRODUCT SEARCH ── */
function prodSearch(q){
  if(pcache[q])return pcache[q];
  const ql=q.toLowerCase();
  return(pcache[q]=P.filter(p=>p.name.toLowerCase().includes(ql)).slice(0,45));
}
function showProdDd(i,res,q){
  const d=document.getElementById('pacd'+i);if(!d)return;
  pDrop=i;pHi=-1;
  d.innerHTML=res.length
    ?res.map((p,j)=>`<div class="paci" data-j="${j}"
        onmousedown="pickProd(event,${i},${P.indexOf(p)})"
        onmouseover="setProdHi(${j})">
        <span class="paci-name">${hl(p.name,q)}</span>
        <span class="paci-unit">${esc(p.unit)}</span>
      </div>`).join('')
    :'<div class="pacd-empty">ไม่พบสินค้า</div>';
  d.style.display='block';
}
function hideProdDd(i){
  const d=document.getElementById('pacd'+i);if(d)d.style.display='none';
  if(pDrop===i){pDrop=-1;pHi=-1;}
}
function setProdHi(j){
  pHi=j;
  document.querySelectorAll('.paci').forEach((el,k)=>el.classList.toggle('hi',k===j));
}
function onProdInput(inp,i){
  const q=inp.value.trim();rows[i].name=q;
  if(!q){hideProdDd(i);return;}
  showProdDd(i,prodSearch(q),q);
}
function onProdKey(e,i){
  const d=document.getElementById('pacd'+i);
  const items=d?d.querySelectorAll('.paci'):[];
  if(e.key==='ArrowDown'){
    e.preventDefault();pHi=Math.min(pHi+1,items.length-1);setProdHi(pHi);
    if(items[pHi])items[pHi].scrollIntoView({block:'nearest'});
  }else if(e.key==='ArrowUp'){
    e.preventDefault();pHi=Math.max(pHi-1,0);setProdHi(pHi);
    if(items[pHi])items[pHi].scrollIntoView({block:'nearest'});
  }else if(e.key==='Enter'||e.key==='Tab'){
    if(d&&d.style.display!=='none'){
      const t=pHi>=0?items[pHi]:items[0];
      if(t){e.preventDefault();t.dispatchEvent(new MouseEvent('mousedown',{bubbles:true}));return;}
    }
  }else if(e.key==='Escape')hideProdDd(i);
}
function onProdBlur(i){setTimeout(()=>hideProdDd(i),180)}
function pickProd(e,rowI,pIdx){
  e.preventDefault();
  const p=P[pIdx];if(!p)return;
  rows[rowI].name=p.name;rows[rowI].unit=p.unit;
  hideProdDd(rowI);
  const inp=document.querySelector(`.prod-inp[data-i="${rowI}"]`);if(inp)inp.value=p.name;
  const ui=document.querySelector(`.unit-inp[data-i="${rowI}"]`);if(ui)ui.value=p.unit;
  setTimeout(()=>{
    const qi=document.querySelector(`.qty-inp[data-i="${rowI}"]`);
    if(qi){qi.focus();qi.select();}
  },0);
}
function onQtyKey(e,i){
  if(e.key==='Enter'||e.key==='Tab'){
    e.preventDefault();
    const ui=document.querySelector(`.unit-inp[data-i="${i}"]`);
    if(ui){ui.focus();ui.select();}
  }
}
function onUnitKey(e,i){
  if(e.key==='Enter'||e.key==='Tab'){
    e.preventDefault();
    const next=i<ROWS-1?i+1:0;
    const ni=document.querySelector(`.prod-inp[data-i="${next}"]`);
    if(ni)ni.focus();
  }
}

/* ── ACTIONS ── */
function clearAll(){
  if(!confirm('ล้างทั้งหมด?'))return;
  document.getElementById('custInp').value='';
  document.getElementById('orderDate').value=new Date().toISOString().split('T')[0];
  initRows();
}
function saveOrder(){
  const nm=document.getElementById('custInp').value.trim();
  if(!nm){alert('กรุณาระบุชื่อลูกค้า');return;}
  const filled=rows.filter(r=>r.name);
  if(!filled.length){alert('กรุณาเพิ่มรายการสินค้า');return;}
  alert('บันทึกสำเร็จ\nเลขที่: '+genDoc()+'\nลูกค้า: '+nm+'\nรายการ: '+filled.length+' รายการ');
  docN++;document.getElementById('docNum').textContent=genDoc();
}
function exportCSV(){
  const nm=document.getElementById('custInp').value||'-';
  const dt=document.getElementById('orderDate').value;
  const filled=rows.filter(r=>r.name);
  if(!filled.length){alert('ไม่มีรายการสินค้า');return;}
  const r2=[['เลขที่',genDoc()],['ลูกค้า',nm],['วันที่',dt],[''],['#','รายการสินค้า','จำนวน','หน่วย']];
  filled.forEach((r,i)=>r2.push([i+1,r.name,r.qty,r.unit]));
  const csv=r2.map(r=>r.map(c=>'"'+String(c||'').replace(/"/g,'""')+'"').join(',')).join('\n');
  const a=document.createElement('a');
  a.href=URL.createObjectURL(new Blob(['\uFEFF'+csv],{type:'text/csv;charset=utf-8'}));
  a.download=genDoc()+'.csv';a.click();
}

initRows();
</script>
</body>
