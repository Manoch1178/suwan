<!DOCTYPE html>
<html lang="th">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Order Note</title>
<style>
*{box-sizing:border-box;margin:0;padding:0}
body{font-family:'Sarabun','Segoe UI',sans-serif;background:#e8e8e8;color:#1a1a1a;font-size:14px}
.screen{max-width:900px;margin:0 auto;padding:16px}
.card{background:#fff;border-radius:10px;padding:14px 16px;box-shadow:0 1px 4px rgba(0,0,0,.08);margin-bottom:12px}
h1{font-size:18px;font-weight:600;color:#1a1a2e;margin-bottom:14px}

/* meta row */
.meta-grid{display:grid;grid-template-columns:1fr 1fr 1fr;gap:10px;margin-bottom:12px}
.field label{display:block;font-size:11px;color:#888;margin-bottom:3px;font-weight:500}
.field input,.field textarea{width:100%;padding:7px 10px;border:1px solid #ddd;border-radius:7px;font-size:13px;font-family:inherit;background:#fafafa}
.field input:focus,.field textarea:focus{outline:none;border-color:#4a6fa5;background:#fff}
.dd-wrap{position:relative}
.dd-list{position:absolute;top:100%;left:0;right:0;background:#fff;border:1px solid #ccc;border-radius:8px;max-height:220px;overflow-y:auto;z-index:200;box-shadow:0 4px 14px rgba(0,0,0,.12);margin-top:2px}
.dd-list div{padding:8px 12px;cursor:pointer;font-size:13px;border-bottom:.5px solid #f0f0f0}
.dd-list div:last-child{border-bottom:none}
.dd-list div:hover{background:#eef2ff}
.dd-sub{font-size:11px;color:#888;float:right}

/* table */
table{width:100%;border-collapse:collapse}
thead th{background:#1a1a2e;color:#fff;padding:8px 10px;font-size:12px;font-weight:500;text-align:left}
tbody td{padding:7px 10px;border-bottom:.5px solid #f0f0f0;font-size:13px;vertical-align:middle}
tbody tr:last-child td{border-bottom:none}
.td-num{text-align:right}
.no-row td{text-align:center;padding:28px;color:#bbb;font-size:13px}

/* inputs in table */
.inp-qty{width:100%;padding:5px 7px;border:1px solid #ddd;border-radius:6px;text-align:center;font-size:13px;font-family:inherit}
.inp-unit{width:100%;padding:5px 7px;border:1px solid #ddd;border-radius:6px;font-size:13px;font-family:inherit}
.inp-qty:focus,.inp-unit:focus{outline:none;border-color:#4a6fa5}
.btn-del{background:none;border:none;color:#cc3333;cursor:pointer;font-size:15px;padding:2px 5px;border-radius:4px;line-height:1}
.btn-del:hover{background:#fff0f0}

/* summary */
.summ-row{display:flex;justify-content:space-between;padding:4px 0;font-size:13px}
.summ-row.total{font-weight:600;font-size:15px;border-top:1px solid #eee;margin-top:6px;padding-top:8px;color:#1a1a2e}

/* actions */
.actions{display:flex;gap:8px;justify-content:flex-end;margin-bottom:14px}
.btn{padding:9px 18px;border-radius:8px;font-size:13px;font-family:inherit;cursor:pointer;border:1px solid #ddd}
.btn-primary{background:#1a1a2e;color:#fff;border-color:#1a1a2e}
.btn-primary:hover{background:#2d2d5e}
.btn-ghost{background:#fff;color:#555}
.btn-ghost:hover{background:#f5f5f5}

/* ===== PRINT ===== */
@media print{
  html,body{margin:0;padding:0;background:#fff}
  .no-print{display:none!important}
  .screen{max-width:595px;margin:0 auto;padding:12px 18px}
  .page-wrap{width:595px;min-height:842px;padding:20px 24px;background:#fff}
  .card{box-shadow:none;border:none;padding:0;margin-bottom:8px}
  thead th{background:#1a1a2e!important;color:#fff!important;-webkit-print-color-adjust:exact;print-color-adjust:exact}
  .inp-qty,.inp-unit{border:none;background:transparent;padding:0;text-align:center}
  .meta-grid{grid-template-columns:1fr 1fr 1fr}
  h1{font-size:15px}
  table{font-size:11px}
  thead th{font-size:11px;padding:6px 8px}
  tbody td{font-size:11px;padding:5px 8px}
  .summ-row{font-size:12px}
  .summ-row.total{font-size:13px}
}
</style>
</head>
<body>
<div class="screen">
<div class="page-wrap">

<div class="card no-print">
<h1>📋 สร้างใบสั่งสินค้า</h1>
<div class="meta-grid">

    <input type="text" id="customer" placeholder="ค้นหาลูกค้า..." autocomplete="off" oninput="searchCust()" />
    <div class="dd-list" id="custDrop" style="display:none"></div>
  </div>
  <div class="field">
    <label>วันที่</label>

  </div>
  <div class="field">

  </div>
</div>

    style="width:100%;padding:8px 12px;border:1px solid #ddd;border-radius:8px;font-size:13px;font-family:inherit;background:#fafafa"
    oninput="searchProd()" />
  <div class="dd-list" id="prodDrop" style="display:none"></div>
</div>
</div>

<!-- print header -->
<div class="card" id="printHeader" style="display:none">
  <div style="display:flex;justify-content:space-between;align-items:flex-start">
    <div>
      <div style="font-size:16px;font-weight:700;color:#1a1a2e">ใบสั่งสินค้า</div>
      <div style="font-size:12px;color:#555;margin-top:3px" id="ph-customer"></div>
    </div>
    <div style="text-align:right;font-size:12px;color:#555">
      <div id="ph-date"></div>
      <div id="ph-note"></div>
    </div>
  </div>
</div>

<div class="card">
<table>
  <thead>
    <tr>
      <th style="width:32px">#</th>
      <th>ชื่อสินค้า</th>
      <th style="width:80px">หน่วย</th>
      <th style="width:70px;text-align:center">จำนวน</th>
      <th style="width:85px;text-align:right">ราคา/หน่วย</th>
      <th style="width:90px;text-align:right">รวม</th>
      <th style="width:34px" class="no-print"></th>
    </tr>
  </thead>
  <tbody id="orderBody">
    <tr class="no-row"><td colspan="7">ยังไม่มีรายการ</td></tr>
  </tbody>
</table>
</div>

<div class="card">
  <div class="summ-row"><span>จำนวนรายการ</span><span id="itemCount">0 รายการ</span></div>
  <div class="summ-row total"><span>ยอดรวมทั้งหมด</span><span id="grandTotal">฿0</span></div>
</div>

<div class="actions no-print">
  <button class="btn btn-ghost" onclick="clearOrder()">ล้างทั้งหมด</button>
  <button class="btn btn-primary" onclick="doPrint()">🖨️ พิมพ์ใบสั่ง</button>
</div>

</div><!-- page-wrap -->
</div><!-- screen -->

let order=[];

/* ---- fuzzy/flexible normalize ---- */
function norm(s){
  return s.toLowerCase()
    .replace(/[\s\u00a0\u3000]+/g,'')      // strip spaces
    .replace(/[^\u0e00-\u0e7fa-z0-9]/g,''); // strip special chars
}

function fuzzyMatch(text, query){
  const nt=norm(text), nq=norm(query);
  if(!nq) return false;
  /* subsequence check: every char of nq appears in order in nt */
  let ti=0,qi=0;
  while(ti<nt.length && qi<nq.length){
    if(nt[ti]===nq[qi]) qi++;
    ti++;
  }
  return qi===nq.length;
}

/* ---- customer search ---- */
const custEl=document.getElementById('customer');
const custDrop=document.getElementById('custDrop');
function searchCust(){
  const q=custEl.value.trim();
  if(!q){custDrop.style.display='none';return;}
  const res=CUSTOMERS.filter(c=>fuzzyMatch(c,q)).slice(0,40);
  if(!res.length){custDrop.style.display='none';return;}
  custDrop.innerHTML=res.map(c=>`<div onclick="pickCust(this.textContent)">${c}</div>`).join('');
  custDrop.style.display='block';
}
function pickCust(name){custEl.value=name;custDrop.style.display='none';}
document.addEventListener('click',e=>{
  if(!e.target.closest('#customer')&&!e.target.closest('#custDrop')) custDrop.style.display='none';
  if(!e.target.closest('#search')&&!e.target.closest('#prodDrop')) prodDrop.style.display='none';
});

/* ---- product search ---- */
const searchEl=document.getElementById('search');
const prodDrop=document.getElementById('prodDrop');
function searchProd(){
  const q=searchEl.value.trim();
  if(!q){prodDrop.style.display='none';return;}
  const res=PRODUCTS.filter(p=>fuzzyMatch(p[0],q)).slice(0,60);
  if(!res.length){prodDrop.style.display='none';return;}
  prodDrop.innerHTML=res.map(p=>{
    const idx=PRODUCTS.indexOf(p);
    return `<div onclick="addProduct(${idx})">${p[0]} <span class="dd-sub">฿${p[1].toLocaleString()} / ${p[2]}</span></div>`;
  }).join('');
  prodDrop.style.display='block';
}

/* ---- add product ---- */
function addProduct(idx){
  const p=PRODUCTS[idx];
  const ex=order.find(o=>o.name===p[0]&&o.price===p[1]);
  if(ex){ex.qty++;}
  else{order.push({name:p[0],price:p[1],unit:p[2],qty:1,expr:''});}
  searchEl.value='';prodDrop.style.display='none';
  renderOrder();
}

/* ---- parse qty expression: supports + e.g. "3+2+1" ---- */
function parseQty(val){
  const s=String(val).trim();
  /* allow only digits, dots, +, space */
  if(!/^[\d\.\+\s]+$/.test(s)) return NaN;
  try{
    const result=s.split('+').reduce((a,b)=>{
      const n=parseFloat(b.trim());
      return isNaN(n)?a:a+n;
    },0);
    return result;
  }catch(e){return NaN;}
}

function removeItem(i){order.splice(i,1);renderOrder();}

function updateQty(i,val){
  order[i].expr=val;
  const q=parseQty(val);
  if(!isNaN(q)&&q>0){order[i].qty=q;}
  renderOrder(true);
}

function updateUnit(i,val){order[i].unit=val;}

function renderOrder(keepFocus){
  const tbody=document.getElementById('orderBody');
  if(!order.length){
    tbody.innerHTML='<tr class="no-row"><td colspan="7">ยังไม่มีรายการ</td></tr>';
    document.getElementById('itemCount').textContent='0 รายการ';
    document.getElementById('grandTotal').textContent='฿0';
    return;
  }
  const focusedQty=keepFocus?document.activeElement:null;
  let total=0;
  tbody.innerHTML=order.map((item,i)=>{
    const q=item.qty||0;
    const sub=item.price*q;
    total+=sub;
    const qval=item.expr||q;
    return `<tr>
      <td style="color:#aaa;font-size:12px">${i+1}</td>
      <td>${item.name}</td>
      <td><input class="inp-unit" data-i="${i}" value="${item.unit}" onchange="updateUnit(${i},this.value)" /></td>
      <td><input class="inp-qty" data-i="${i}" value="${qval}" onchange="updateQty(${i},this.value)" placeholder="0" /></td>
      <td class="td-num">฿${item.price.toLocaleString()}</td>
      <td class="td-num" style="font-weight:500">฿${sub.toLocaleString()}</td>
      <td class="no-print"><button class="btn-del" onclick="removeItem(${i})">✕</button></td>
    </tr>`;
  }).join('');
  document.getElementById('itemCount').textContent=`${order.length} รายการ`;
  document.getElementById('grandTotal').textContent=`฿${total.toLocaleString()}`;
}

function clearOrder(){
  if(order.length&&!confirm('ล้างรายการทั้งหมด?'))return;
  order=[];renderOrder();
}

function doPrint(){
  const c=document.getElementById('customer').value;
  const d=document.getElementById('orderdate').value;
  const n=document.getElementById('note').value;
  document.getElementById('ph-customer').textContent=c?'ลูกค้า: '+c:'';
  document.getElementById('ph-date').textContent=d?'วันที่: '+d:'';
  document.getElementById('ph-note').textContent=n?'หมายเหตุ: '+n:'';
  document.getElementById('printHeader').style.display='block';
  window.print();
  document.getElementById('printHeader').style.display='none';
}
