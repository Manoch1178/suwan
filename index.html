<!DOCTYPE html>
<html lang="th">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>ระบบสินค้า</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Anuphan:wght@300;400;500;600;700&family=Chakra+Petch:wght@400;500;600;700&family=Space+Mono:wght@400;700&display=swap" rel="stylesheet">
<style>
:root {
  --bg: #f0ede6;
  --bg2: #e8e4dc;
  --bg3: #ddd8ce;
  --surface: #faf9f5;
  --ink: #1e1c16;
  --ink2: #3d3a2e;
  --ink3: #706c5c;
  --ink4: #a09a88;
  --ink5: #cec9bc;
  --line: #dcd8cc;
  --line2: #e6e2d8;
  --rust: #bf4424;
  --rust2: #913218;
  --rust-lt: #faeae6;
  --teal: #1a6860;
  --teal-lt: #e4f2f0;
  --gold: #b87820;
  --sans: 'Anuphan', sans-serif;
  --display: 'Chakra Petch', sans-serif;
  --mono: 'Space Mono', monospace;
}
* { box-sizing: border-box; margin: 0; padding: 0; }
html { font-size: 14px; }
body { font-family: var(--sans); background: var(--bg); color: var(--ink); min-height: 100vh; }

/* ── NAV ── */
.nav {
  position: sticky; top: 0; z-index: 100;
  background: rgba(240,237,230,.95);
  backdrop-filter: blur(16px);
  border-bottom: 1px solid var(--line);
  height: 58px;
  display: flex; align-items: center;
  padding: 0 22px; gap: 14px;
}
.brand {
  font-family: var(--display);
  font-size: 17px; font-weight: 700;
  color: var(--ink); flex-shrink: 0;
  letter-spacing: .5px;
}
.brand span { color: var(--rust); }

/* ── SEARCH ZONE ── */
.search-zone { flex: 1; position: relative; max-width: 560px; margin: 0 auto; }
.search-wrap { position: relative; }
.search-box {
  width: 100%;
  padding: 9px 38px 9px 42px;
  background: var(--surface);
  border: 2px solid var(--line);
  border-radius: 10px;
  font-family: var(--sans); font-size: 14px; color: var(--ink);
  outline: none; transition: border-color .18s, box-shadow .18s;
}
.search-box:focus {
  border-color: var(--rust);
  box-shadow: 0 0 0 3px rgba(191,68,36,.1);
}
.search-box::placeholder { color: var(--ink5); }
.s-ico {
  position: absolute; left: 13px; top: 50%;
  transform: translateY(-50%);
  color: var(--ink4); font-size: 15px; pointer-events: none;
}
.s-clear {
  position: absolute; right: 11px; top: 50%;
  transform: translateY(-50%);
  width: 20px; height: 20px; border-radius: 50%;
  background: var(--ink5); color: var(--surface);
  border: none; cursor: pointer; font-size: 13px;
  display: none; align-items: center; justify-content: center;
  transition: background .12s; line-height: 1;
}
.s-clear:hover { background: var(--ink3); }
.s-clear.v { display: flex; }

/* Fuzzy hint below search */
.fuzzy-hint {
  font-family: var(--mono); font-size: 9.5px;
  color: var(--ink5); margin-top: 4px;
  padding-left: 2px; display: none;
  letter-spacing: .3px;
}
.fuzzy-hint.v { display: block; }
.fuzzy-hint .fq { color: var(--rust); font-weight: 700; }

/* Nav right */
.nav-right { display: flex; align-items: center; gap: 7px; flex-shrink: 0; }
.count-pill {
  font-family: var(--mono); font-size: 10px;
  color: var(--ink4); background: var(--bg2);
  border: 1px solid var(--line); padding: 3px 9px;
  border-radius: 20px; white-space: nowrap;
}
.view-btns { display: flex; gap: 3px; }
.vb {
  width: 30px; height: 30px; border: 1px solid var(--line);
  border-radius: 6px; background: var(--bg2);
  color: var(--ink4); cursor: pointer; font-size: 14px;
  display: flex; align-items: center; justify-content: center;
  transition: all .12s;
}
.vb.on { background: var(--ink); color: var(--surface); border-color: var(--ink); }
.cart-btn {
  display: flex; align-items: center; gap: 6px;
  padding: 7px 14px; background: var(--rust); color: #fff;
  border: none; border-radius: 8px; cursor: pointer;
  font-family: var(--display); font-size: 12.5px; font-weight: 600;
  transition: background .14s; letter-spacing: .3px;
}
.cart-btn:hover { background: var(--rust2); }
.cart-n {
  display: none; align-items: center; justify-content: center;
  min-width: 17px; height: 17px; padding: 0 3px;
  background: #fff; color: var(--rust);
  border-radius: 9px; font-family: var(--mono);
  font-size: 9.5px; font-weight: 700;
}
.cart-n.v { display: flex; }

/* ── MAIN ── */
.main { padding: 16px 22px 60px; }

/* Sort / filter bar */
.bar {
  display: flex; align-items: center; gap: 7px;
  margin-bottom: 14px; flex-wrap: wrap;
}
.bar-lbl { font-family: var(--mono); font-size: 9px; color: var(--ink4); letter-spacing: 1.5px; text-transform: uppercase; margin-right: 2px; }
.chip {
  padding: 4px 12px; border: 1px solid var(--line); border-radius: 20px;
  background: var(--surface); color: var(--ink3);
  font-family: var(--sans); font-size: 12px; cursor: pointer;
  transition: all .12s;
}
.chip:hover { background: var(--bg2); color: var(--ink); }
.chip.on { background: var(--ink); color: var(--surface); border-color: var(--ink); }
.spacer { flex: 1; }
.unit-sel {
  padding: 5px 11px; border: 1px solid var(--line); border-radius: 20px;
  background: var(--surface); color: var(--ink3);
  font-family: var(--sans); font-size: 12px;
  cursor: pointer; outline: none; transition: border-color .12s;
}
.unit-sel:focus { border-color: var(--rust); }

/* ── GRID ── */
.prod-grid {
  display: grid;
  grid-template-columns: repeat(auto-fill, minmax(172px,1fr));
  gap: 8px;
}
.card {
  background: var(--surface); border: 1px solid var(--line);
  border-radius: 10px; padding: 12px 11px 10px;
  cursor: pointer; transition: all .16s;
  display: flex; flex-direction: column; gap: 6px;
  position: relative; overflow: hidden;
}
.card:hover {
  transform: translateY(-2px);
  box-shadow: 0 6px 20px rgba(0,0,0,.1);
  border-color: var(--rust);
}
.card.in-cart { background: #f3faf8; border-color: rgba(26,104,96,.3); }
.c-top { display: flex; justify-content: space-between; align-items: flex-start; gap: 6px; }
.c-unit {
  font-family: var(--mono); font-size: 8px; letter-spacing: .5px;
  color: var(--ink4); background: var(--bg2); padding: 2px 6px;
  border-radius: 3px; flex-shrink: 0;
}
.c-tick {
  width: 15px; height: 15px; border-radius: 50%;
  background: var(--teal); color: #fff;
  font-size: 9px; font-weight: 700;
  display: none; align-items: center; justify-content: center; flex-shrink: 0;
}
.card.in-cart .c-tick { display: flex; }
.c-name { font-size: 12.5px; font-weight: 500; color: var(--ink); line-height: 1.35; flex: 1; }
/* Fuzzy highlight */
.c-name mark, .pl-name mark { background: none; color: var(--rust); font-weight: 700; }
.c-price { font-family: var(--mono); font-size: 14px; font-weight: 700; color: var(--ink2); }
.c-price.z { font-size: 11px; color: var(--ink5); font-weight: 400; }
.c-add {
  padding: 7px; border: none; border-radius: 6px;
  background: var(--bg2); color: var(--ink3);
  font-family: var(--sans); font-size: 11px; font-weight: 600;
  cursor: pointer; transition: all .12s;
  display: flex; align-items: center; justify-content: center; gap: 4px;
}
.c-add:hover { background: var(--rust-lt); color: var(--rust); }
.card.in-cart .c-add { background: var(--teal-lt); color: var(--teal); }

/* ── LIST ── */
.prod-list { border-radius: 10px; overflow: hidden; border: 1px solid var(--line); }
.lh {
  display: grid; grid-template-columns: 1fr 85px 68px 78px 28px;
  gap: 10px; padding: 7px 14px;
  background: var(--bg3); border-bottom: 1px solid var(--line);
}
.lh span { font-family: var(--mono); font-size: 8.5px; font-weight: 700; letter-spacing: 1px; text-transform: uppercase; color: var(--ink4); }
.lh span:nth-child(4) { text-align: right; }
.lr {
  display: grid; grid-template-columns: 1fr 85px 68px 78px 28px;
  gap: 10px; align-items: center;
  padding: 9px 14px; background: var(--surface);
  border-bottom: .5px solid var(--line2);
  cursor: pointer; transition: background .1s;
}
.lr:last-child { border-bottom: none; }
.lr:hover { background: var(--rust-lt); }
.lr.in-cart { background: var(--teal-lt); }
.pl-name { font-size: 13px; font-weight: 500; color: var(--ink); }
.pl-bc { font-family: var(--mono); font-size: 9px; color: var(--ink5); }
.pl-ub {
  font-family: var(--mono); font-size: 9.5px; color: var(--ink4);
  background: var(--bg2); padding: 2px 6px; border-radius: 3px;
  display: inline-block;
}
.pl-price { font-family: var(--mono); font-size: 12.5px; font-weight: 700; color: var(--ink2); text-align: right; }
.pl-btn {
  width: 26px; height: 26px; border: 1px solid var(--line); border-radius: 5px;
  background: var(--bg2); color: var(--ink4); cursor: pointer; font-size: 15px;
  display: flex; align-items: center; justify-content: center; transition: all .12s;
}
.pl-btn:hover { background: var(--rust-lt); border-color: var(--rust); color: var(--rust); }
.lr.in-cart .pl-btn { background: var(--teal-lt); border-color: var(--teal); color: var(--teal); }

/* ── PAGER ── */
.pager {
  display: flex; align-items: center; justify-content: center;
  gap: 5px; margin-top: 20px; flex-wrap: wrap;
}
.pg {
  padding: 5px 11px; border: 1px solid var(--line); border-radius: 6px;
  background: var(--surface); color: var(--ink3);
  font-family: var(--mono); font-size: 11px; cursor: pointer; transition: all .12s;
}
.pg:hover { background: var(--bg2); }
.pg.on { background: var(--ink); color: var(--surface); border-color: var(--ink); }
.pg:disabled { opacity: .35; cursor: default; pointer-events: none; }
.pg-sep { font-family: var(--mono); font-size: 11px; color: var(--ink5); padding: 0 3px; }

/* Empty */
.empty { text-align: center; padding: 60px 20px; color: var(--ink4); }
.empty-ico { font-size: 42px; opacity: .25; margin-bottom: 12px; }
.empty-txt { font-size: 14px; line-height: 1.7; }

/* ── CART DRAWER ── */
.overlay {
  position: fixed; inset: 0; background: rgba(30,28,22,.4);
  z-index: 200; opacity: 0; pointer-events: none; transition: opacity .25s;
}
.overlay.on { opacity: 1; pointer-events: all; }
.drawer {
  position: fixed; top: 0; right: 0; bottom: 0; width: 390px;
  background: var(--surface); z-index: 201;
  border-left: 1px solid var(--line);
  transform: translateX(100%);
  transition: transform .28s cubic-bezier(.2,0,.2,1);
  display: flex; flex-direction: column;
  box-shadow: -6px 0 30px rgba(0,0,0,.12);
}
.drawer.on { transform: translateX(0); }
.dh {
  display: flex; align-items: center; justify-content: space-between;
  padding: 15px 18px; border-bottom: 1px solid var(--line); flex-shrink: 0;
}
.dh-title { font-family: var(--display); font-size: 17px; font-weight: 700; letter-spacing: .3px; }
.dx {
  width: 30px; height: 30px; border: 1px solid var(--line); border-radius: 6px;
  background: var(--bg2); color: var(--ink3); cursor: pointer; font-size: 17px;
  display: flex; align-items: center; justify-content: center; transition: all .12s;
}
.dx:hover { background: var(--bg3); color: var(--ink); }
.d-cust {
  padding: 11px 16px; border-bottom: 1px solid var(--line); flex-shrink: 0;
}
.d-cust-lbl { font-family: var(--mono); font-size: 8.5px; letter-spacing: 2px; text-transform: uppercase; color: var(--ink4); margin-bottom: 5px; }
.d-cust-inp {
  width: 100%; padding: 7px 10px;
  background: var(--bg2); border: 1px solid var(--line); border-radius: 6px;
  font-family: var(--sans); font-size: 13.5px; font-weight: 500; color: var(--ink);
  outline: none; transition: border-color .14s;
}
.d-cust-inp:focus { border-color: var(--rust); }
.d-cust-inp::placeholder { color: var(--ink5); }
.d-items { flex: 1; overflow-y: auto; scrollbar-width: thin; scrollbar-color: var(--line) transparent; }
.d-items::-webkit-scrollbar { width: 4px; }
.d-items::-webkit-scrollbar-thumb { background: var(--line); border-radius: 2px; }
.d-empty {
  display: flex; flex-direction: column; align-items: center; justify-content: center;
  height: 100%; gap: 10px; color: var(--ink4);
}
.d-empty-ico { font-size: 38px; opacity: .22; }
.d-empty-txt { font-size: 13px; }
.di {
  display: flex; align-items: flex-start; gap: 9px;
  padding: 10px 16px; border-bottom: .5px solid var(--line2); transition: background .1s;
}
.di:hover { background: var(--bg2); }
.di-n { font-family: var(--mono); font-size: 10px; color: var(--ink5); width: 18px; flex-shrink: 0; padding-top: 2px; }
.di-body { flex: 1; min-width: 0; }
.di-name { font-size: 12.5px; font-weight: 500; color: var(--ink); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; margin-bottom: 3px; }
.di-meta { display: flex; gap: 5px; align-items: center; }
.di-unit { font-family: var(--mono); font-size: 9.5px; color: var(--ink4); }
.di-up { font-family: var(--mono); font-size: 10px; color: var(--ink3); }
.di-ctrl { display: flex; align-items: center; flex-shrink: 0; }
.qb {
  width: 24px; height: 24px; border: 1px solid var(--line); background: var(--bg2);
  color: var(--ink3); cursor: pointer; font-size: 14px; font-weight: 600;
  display: flex; align-items: center; justify-content: center; transition: background .12s;
}
.qb:first-child { border-radius: 4px 0 0 4px; }
.qb:last-child { border-radius: 0 4px 4px 0; }
.qb:hover { background: var(--bg3); }
.qn {
  width: 36px; height: 24px; text-align: center;
  border: 1px solid var(--line); border-left: none; border-right: none;
  background: var(--surface); font-family: var(--mono); font-size: 12px; font-weight: 700;
  outline: none; color: var(--ink);
}
.di-tot { font-family: var(--mono); font-size: 12.5px; font-weight: 700; color: var(--ink2); width: 66px; text-align: right; flex-shrink: 0; padding-top: 2px; }
.di-del {
  width: 20px; height: 20px; background: none; border: none; cursor: pointer;
  color: var(--ink5); font-size: 14px;
  display: flex; align-items: center; justify-content: center;
  border-radius: 4px; transition: all .12s; flex-shrink: 0; margin-top: 2px;
}
.di-del:hover { background: var(--rust-lt); color: var(--rust); }
.d-sum { border-top: 1px solid var(--line); padding: 12px 16px; flex-shrink: 0; }
.dsrow { display: flex; justify-content: space-between; align-items: center; padding: 3px 0; font-size: 13px; }
.ds-lbl { color: var(--ink3); }
.ds-val { font-family: var(--mono); font-weight: 500; }
.d-disc { display: flex; align-items: center; gap: 7px; margin: 6px 0; }
.dd-lbl { font-size: 12px; color: var(--ink3); flex-shrink: 0; }
.dd-inp {
  flex: 1; padding: 5px 8px; background: var(--bg2); border: 1px solid var(--line); border-radius: 5px;
  font-family: var(--mono); font-size: 12px; text-align: right; color: var(--ink); outline: none;
  transition: border-color .14s;
}
.dd-inp:focus { border-color: var(--rust); }
.d-div { border: none; border-top: 1.5px solid var(--ink2); margin: 9px 0 7px; }
.d-grand { display: flex; justify-content: space-between; align-items: baseline; }
.dg-lbl { font-family: var(--display); font-size: 14px; font-weight: 700; }
.dg-val { font-family: var(--mono); font-size: 24px; font-weight: 700; color: var(--ink); }
.d-acts { display: flex; gap: 7px; padding: 11px 16px; border-top: 1px solid var(--line); flex-shrink: 0; }
.da {
  flex: 1; padding: 10px; border-radius: 7px; border: none; cursor: pointer;
  font-family: var(--display); font-size: 12.5px; font-weight: 700; transition: all .14s;
}
.da-ghost { background: var(--bg2); color: var(--ink3); border: 1px solid var(--line); }
.da-ghost:hover { background: var(--bg3); }
.da-csv { background: var(--teal); color: #fff; }
.da-csv:hover { filter: brightness(1.1); }
.da-save { background: var(--ink); color: var(--surface); }
.da-save:hover { background: var(--ink2); }

/* Modal */
.modal-bg {
  position: fixed; inset: 0; background: rgba(30,28,22,.45);
  z-index: 300; display: flex; align-items: center; justify-content: center;
  padding: 20px; opacity: 0; pointer-events: none; transition: opacity .2s;
}
.modal-bg.on { opacity: 1; pointer-events: all; }
.modal {
  background: var(--surface); border-radius: 14px; padding: 24px;
  max-width: 390px; width: 100%; position: relative;
  transform: translateY(14px); transition: transform .2s;
  border: 1px solid var(--line); box-shadow: 0 20px 60px rgba(0,0,0,.18);
}
.modal-bg.on .modal { transform: translateY(0); }
.mx {
  position: absolute; top: 14px; right: 14px;
  width: 28px; height: 28px; border: 1px solid var(--line); border-radius: 6px;
  background: var(--bg2); color: var(--ink3); cursor: pointer; font-size: 16px;
  display: flex; align-items: center; justify-content: center; transition: all .12s;
}
.mx:hover { background: var(--bg3); }
.m-bc { font-family: var(--mono); font-size: 9.5px; color: var(--ink5); letter-spacing: 1px; margin-bottom: 5px; }
.m-unit {
  display: inline-block; font-family: var(--mono); font-size: 9px;
  color: var(--ink4); background: var(--bg2); border: 1px solid var(--line);
  padding: 2px 8px; border-radius: 3px; margin-bottom: 7px;
}
.m-name { font-family: var(--display); font-size: 19px; font-weight: 700; color: var(--ink); margin-bottom: 8px; line-height: 1.25; letter-spacing: .2px; }
.m-price { font-family: var(--mono); font-size: 26px; font-weight: 700; color: var(--ink); margin-bottom: 18px; }
.m-price.z { font-size: 14px; color: var(--ink4); font-weight: 400; }
.m-qr { display: flex; align-items: center; gap: 12px; margin-bottom: 16px; }
.m-ql { font-family: var(--mono); font-size: 9px; letter-spacing: 2px; text-transform: uppercase; color: var(--ink4); }
.mqc { display: flex; align-items: center; border: 1.5px solid var(--line); border-radius: 8px; overflow: hidden; }
.mqb {
  width: 36px; height: 36px; background: var(--bg2); border: none;
  cursor: pointer; font-size: 17px; color: var(--ink3); transition: background .12s;
  display: flex; align-items: center; justify-content: center;
}
.mqb:hover { background: var(--bg3); }
.mqv {
  width: 50px; height: 36px; text-align: center;
  border: none; border-left: 1.5px solid var(--line); border-right: 1.5px solid var(--line);
  font-family: var(--mono); font-size: 14px; font-weight: 700;
  background: var(--surface); outline: none; color: var(--ink);
}
.m-add {
  width: 100%; padding: 12px; border: none; border-radius: 8px;
  font-family: var(--display); font-size: 14px; font-weight: 700;
  background: var(--ink); color: var(--surface); cursor: pointer; transition: all .14s;
}
.m-add:hover { background: var(--ink2); }
.m-add.done { background: var(--teal); }

/* Toast */
.toast {
  position: fixed; bottom: 22px; left: 50%; z-index: 500;
  transform: translateX(-50%) translateY(16px);
  background: var(--ink2); color: var(--surface);
  padding: 8px 18px; border-radius: 8px;
  font-size: 13px; font-weight: 500;
  box-shadow: 0 6px 20px rgba(0,0,0,.2);
  opacity: 0; transition: all .22s; white-space: nowrap;
}
.toast.v { opacity: 1; transform: translateX(-50%) translateY(0); }
.toast.ok { background: var(--teal); }
</style>
</head>
<body>

<nav class="nav">
  <div class="brand">SHOP<span>●</span></div>
  <div class="search-zone">
    <div class="search-wrap">
      <span class="s-ico">⌕</span>
      <input class="search-box" id="srch" type="text"
        placeholder="ค้นหาชื่อสินค้า (รองรับการค้นหาแบบสุ่มตัวอักษร)..."
        autocomplete="off" spellcheck="false">
      <button class="s-clear" id="sClear" onclick="clearSrch()">×</button>
    </div>
    <div class="fuzzy-hint" id="fuzzyHint"></div>
  </div>
  <div class="nav-right">
    <span class="count-pill" id="cPill">7,078</span>
    <div class="view-btns">
      <button class="vb on" id="vb-g" onclick="setView('grid')" title="กริด">⊞</button>
      <button class="vb" id="vb-l" onclick="setView('list')" title="รายการ">☰</button>
    </div>
    <button class="cart-btn" onclick="openCart()">
      🛒 <span class="cart-n" id="cartN">0</span>
    </button>
  </div>
</nav>

<div class="main">
  <div class="bar">
    <span class="bar-lbl">เรียง</span>
    <button class="chip on" data-s="" onclick="setSort(this,'')">ค่าเริ่มต้น</button>
    <button class="chip" data-s="pa" onclick="setSort(this,'pa')">ราคา ↑</button>
    <button class="chip" data-s="pd" onclick="setSort(this,'pd')">ราคา ↓</button>

/* ══ FUZZY SEARCH ══
   Match all chars of query in order, anywhere in the name.
   Score: prefers contiguous runs, start-of-word matches.
   Returns {match:bool, score:number, html:string}
*/
function fuzzyMatch(text, query) {
  if(!query) return {match:true, score:0, html:text};
  const tl = text.toLowerCase();
  const ql = query.toLowerCase();
  
  // Fast exact/contains first (best score)
  const ci = tl.indexOf(ql);
  if(ci >= 0) {
    const html = text.slice(0,ci)+'<mark>'+text.slice(ci,ci+ql.length)+'</mark>'+text.slice(ci+ql.length);
    return {match:true, score:1000+ci, html};
  }
  
  // Fuzzy: all chars must appear in order
  let ti=0, qi=0, matchIdx=[];
  while(ti<tl.length && qi<ql.length){
    if(tl[ti]===ql[qi]){matchIdx.push(ti);qi++;}
    ti++;
  }
  if(qi<ql.length) return {match:false,score:-1,html:text}; // not all chars matched
  
  // Score: fewer gaps = better
  let gaps=0;
  for(let i=1;i<matchIdx.length;i++) gaps+=(matchIdx[i]-matchIdx[i-1]-1);
  const score = 500 - gaps - matchIdx[0]; // starts early = bonus
  
  // Build highlighted html
  let html='',mi=0;
  for(let i=0;i<text.length;i++){
    if(mi<matchIdx.length && i===matchIdx[mi]){
      html+='<mark>'+text[i]+'</mark>';mi++;
    } else {
      html+=text[i];
    }
  }
  return {match:true, score, html};
}

// Fuzzy hint
function updateFuzzyHint(q,count){
  const hint=document.getElementById('fuzzyHint');
  if(!q){hint.classList.remove('v');return;}
  hint.innerHTML=`ค้นหาคำว่า "<span class="fq">${q}</span>" · พบ ${count.toLocaleString()} รายการ`;
  hint.classList.add('v');
}

function applyFilters(){
  const q=srch.value.trim();
  const u=document.getElementById('unitSel').value;
  lastQ=q;
  
  if(!q && !u){
    filtered=P.slice();
    lastHighlight=P.map(()=>null);
  } else {
    const scored=[];
    for(let i=0;i<P.length;i++){
      const p=P[i];
      if(u && p.unit!==u) continue;
      if(!q){scored.push({p,i,score:0,html:null});continue;}
      const r=fuzzyMatch(p.name,q);
      if(r.match) scored.push({p,i,score:r.score,html:r.html});
    }
    // Sort by score desc (best matches first)
    if(q) scored.sort((a,b)=>b.score-a.score);
    filtered=scored.map(x=>x.p);
    lastHighlight=scored.map(x=>x.html);
  }
  
  updateFuzzyHint(q,filtered.length);
  
  if(sortMode==='pa') filtered.sort((a,b)=>a.price-b.price);
  else if(sortMode==='pd') filtered.sort((a,b)=>b.price-a.price);
  else if(sortMode==='az') filtered.sort((a,b)=>a.name.localeCompare(b.name,'th'));
  
  page=1;render();
}

function getHL(i){
  // i is index in filtered (after sort, highlight may not align if sorted)
  // When sorted, we lose highlight order — fall back to simple
  if(sortMode && lastQ) return null;
  return lastHighlight[i]||null;
}

function render(){
  const total=filtered.length;
  const totalPages=Math.max(1,Math.ceil(total/perPage));
  if(page>totalPages) page=totalPages;
  const sl=filtered.slice((page-1)*perPage,page*perPage);
  const offset=(page-1)*perPage;
  
  document.getElementById('cPill').textContent=total.toLocaleString();
  
  const wrap=document.getElementById('wrap');
  if(!sl.length){
    const q=srch.value.trim();
    wrap.innerHTML=`<div class="empty"><div class="empty-ico">🔍</div><div class="empty-txt">${q?'ไม่พบสินค้าที่ตรงกับ "<b>'+q+'</b>"<br>ลองพิมพ์ตัวอักษรอื่น':'ไม่พบสินค้า'}</div></div>`;
    document.getElementById('pager').innerHTML='';return;
  }
  
  if(viewMode==='grid'){
    wrap.innerHTML='<div class="prod-grid">'+sl.map((p,i)=>{
      const gi=offset+i;
      const ic=inCart(p.name);
      const hl=getHL(gi);
      const nameHtml=hl||escHtml(p.name);
      return`<div class="card${ic?' in-cart':''}" onclick="openModal(${gi})">
        <div class="c-top">
          <span class="c-unit">${p.unit}</span>
          <span class="c-tick">✓</span>
        </div>
        <div class="c-name">${nameHtml}</div>
        ${p.price>0?`<div class="c-price">${fmt(p.price)}</div>`:'<div class="c-price z">—</div>'}
        <button class="c-add" onclick="event.stopPropagation();quickAdd(${gi})">${ic?'✓ ในตะกร้า':'+ เพิ่ม'}</button>
      </div>`;
    }).join('')+'</div>';
  } else {
    wrap.innerHTML='<div class="prod-list">'+
      '<div class="lh"><span>ชื่อสินค้า</span><span>บาร์โค้ด</span><span>หน่วย</span><span>ราคา</span><span></span></div>'+
      sl.map((p,i)=>{
        const gi=offset+i;const ic=inCart(p.name);
        const hl=getHL(gi);const nameHtml=hl||escHtml(p.name);
        return`<div class="lr${ic?' in-cart':''}" onclick="openModal(${gi})">
          <span class="pl-name">${nameHtml}</span>
          <span class="pl-bc">${p.barcode||''}</span>
          <span><span class="pl-ub">${p.unit}</span></span>
          <span class="pl-price">${p.price>0?fmt(p.price):'—'}</span>
          <button class="pl-btn" onclick="event.stopPropagation();quickAdd(${gi})">${ic?'✓':'+'}</button>
        </div>`;
      }).join('')+'</div>';
  }
  renderPager(totalPages);
}

function escHtml(s){return String(s).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;')}

function renderPager(total){
  const pg=document.getElementById('pager');
  if(total<=1){pg.innerHTML='';return;}
  let h=`<button class="pg" onclick="goPage(${page-1})"${page===1?' disabled':''}>←</button>`;
  const show=[];
  for(let i=1;i<=total;i++){
    if(i===1||i===total||Math.abs(i-page)<=1)show.push(i);
    else if(show[show.length-1]!=='…')show.push('…');
  }
  show.forEach(r=>{
    if(r==='…')h+=`<span class="pg-sep">…</span>`;
    else h+=`<button class="pg${r===page?' on':''}" onclick="goPage(${r})">${r}</button>`;
  });
  h+=`<button class="pg" onclick="goPage(${page+1})"${page===total?' disabled':''}>→</button>`;
  pg.innerHTML=h;
}
function goPage(p){page=p;render();window.scrollTo({top:58,behavior:'smooth'})}

// Cart
function quickAdd(gi){
  const p=filtered[gi];if(!p)return;
  addToCart(p,1);render();toast('เพิ่ม '+p.name,true);
}
function addToCart(p,qty){
  const ex=cart.find(c=>c.name===p.name);
  if(ex)ex.qty=parseFloat((ex.qty+qty).toFixed(4));
  else cart.push({name:p.name,unit:p.unit,price:p.price,qty});
  updateBadge();
  if(document.getElementById('drawer').classList.contains('on')) renderDItems();
}
function updateBadge(){
  const n=cart.length;
  const b=document.getElementById('cartN');
  b.textContent=n;b.classList.toggle('v',n>0);
}
function openCart(){
  document.getElementById('overlay').classList.add('on');
  document.getElementById('drawer').classList.add('on');
  renderDItems();
}
function closeCart(){
  document.getElementById('overlay').classList.remove('on');
  document.getElementById('drawer').classList.remove('on');
}
function renderDItems(){
  const el=document.getElementById('dItems');
  if(!cart.length){
    el.innerHTML='<div class="d-empty"><div class="d-empty-ico">🛒</div><div class="d-empty-txt">ยังไม่มีสินค้า</div></div>';
    calcSum();return;
  }
  el.innerHTML=cart.map((c,i)=>`
    <div class="di">
      <span class="di-n">${i+1}</span>
      <div class="di-body">
        <div class="di-name" title="${c.name}">${c.name}</div>
        <div class="di-meta">
          <span class="di-unit">${c.unit}</span>
          ${c.price>0?`<span class="di-up">${fmt(c.price)}/หน่วย</span>`:''}
        </div>
      </div>
      <div class="di-ctrl">
        <button class="qb" onclick="adjQty(${i},-1)">−</button>
        <input class="qn" type="number" min="0.001" step="any" value="${c.qty}"
          onchange="setQty(${i},this.value)" oninput="setQty(${i},this.value)">
        <button class="qb" onclick="adjQty(${i},1)">+</button>
      </div>
      <span class="di-tot">${fmt(c.qty*c.price)}</span>
      <button class="di-del" onclick="delItem(${i})">×</button>
    </div>`).join('');
  calcSum();
}
function adjQty(i,d){
  cart[i].qty=parseFloat(Math.max(0.001,cart[i].qty+d).toFixed(4));
  renderDItems();
}
function setQty(i,v){
  const n=parseFloat(v);cart[i].qty=(isNaN(n)||n<=0)?0.001:n;
  const tots=document.querySelectorAll('.di-tot');
  if(tots[i])tots[i].textContent=fmt(cart[i].qty*cart[i].price);
  calcSum();
}
function delItem(i){cart.splice(i,1);updateBadge();renderDItems();render();}
function clearCart(){
  if(!confirm('ล้างตะกร้า?'))return;
  cart=[];updateBadge();renderDItems();render();
}
function calcSum(){
  const sub=cart.reduce((s,c)=>s+c.qty*c.price,0);
  const disc=parseFloat(document.getElementById('discInp').value)||0;
  const grand=Math.max(0,sub-disc);
  document.getElementById('dSI').textContent=cart.length+' รายการ';
  document.getElementById('dSub').textContent=fmt(sub);
  document.getElementById('dGrand').textContent=fmt(grand);
}

function exportCSV(){
  if(!cart.length){toast('ตะกร้าว่างเปล่า');return;}
  const nm=document.getElementById('custName').value||'-';
  const disc=parseFloat(document.getElementById('discInp').value)||0;
  const sub=cart.reduce((s,c)=>s+c.qty*c.price,0);
  const grand=Math.max(0,sub-disc);
  const rows=[['ลูกค้า',nm],['วันที่',new Date().toLocaleDateString('th-TH')],[''],
    ['#','ชื่อสินค้า','หน่วย','จำนวน','ราคา/หน่วย','รวม']];
  cart.forEach((c,i)=>rows.push([i+1,c.name,c.unit,c.qty,c.price.toFixed(2),(c.qty*c.price).toFixed(2)]));
  rows.push([''],['','','','','ยอดรวม',sub.toFixed(2)]);
  if(disc>0)rows.push(['','','','','ส่วนลด',disc.toFixed(2)]);
  rows.push(['','','','','ยอดสุทธิ',grand.toFixed(2)]);
  const csv=rows.map(r=>r.map(c=>'"'+String(c).replace(/"/g,'""')+'"').join(',')).join('\n');
  const a=document.createElement('a');
  a.href=URL.createObjectURL(new Blob(['\uFEFF'+csv],{type:'text/csv;charset=utf-8'}));
  a.download='order-'+Date.now()+'.csv';a.click();
  toast('ส่งออก CSV แล้ว',true);
}

// Init
render();
</script>
